{% extends 'base.html' %}

{% block title %} - Direct Messages{% endblock %}

{% block content %}
<div class="container-fluid mt-3">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4 text-center">Direct Messages</h2>
            <div id="chat-container" style="border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px;">
                {% for chat in messages %}
                    {% if chat.sender == current_user %}
                        <!-- Outgoing message (right side) -->
                        <div class="d-flex justify-content-end mb-3">
                            <div class="chat-bubble user-bubble">
                                {{ chat.message }}
                            </div>
                        </div>
                    {% else %}
                        <div class="d-flex justify-content-start mb-3 align-items-start">
                            <img src="{{ photos_folder + recipient_photo }}"
                                alt="Profile Picture" 
                                class="rounded-circle mr-2" 
                                width="40" height="40">
                            <div class="chat-bubble llm-bubble">
                                {{ chat.message }}
                            </div>
                        </div>
                    {% endif %}
                {% endfor %}
            </div>
            <div class="mt-3">
                <form action="/direct_messages" method="post">
                    <input type="hidden" name="username" value="{{ recipient }}">
                    <div class="input-group">
                        <textarea name="message" class="form-control" rows="1" placeholder="Enter your message..." required></textarea>
                        <div class="input-group-append">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
